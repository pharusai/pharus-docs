<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- ledger label: only completion touches inventory -->
  <text x="659" y="46" text-anchor="middle" font-size="11" fill="#0891b2">posts RECEIVE</text>

  <!-- linear chain, bidirectional -->
  <line x1="154" y1="81" x2="214" y2="81" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="344" y1="81" x2="404" y2="81" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="534" y1="81" x2="594" y2="81" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- cancel / reactivate: from Planning, Placed, or In Transit (before Completed) -->
  <line x1="89"  y1="106" x2="89"  y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="279" y1="106" x2="279" y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="469" y1="106" x2="469" y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="89"  y1="140" x2="469" y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="279" y1="140" x2="279" y2="210" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="295" y="178" text-anchor="start" font-size="12" fill="#475569">cancel / reactivate</text>
  <text x="295" y="194" text-anchor="start" font-size="11" fill="#94a3b8">(before Completed only)</text>

  <!-- state boxes -->
  <g font-size="14" font-weight="600" fill="#0f172a">
    <rect x="24"  y="56" width="130" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="89"  y="86" text-anchor="middle">Planning</text>
    <rect x="214" y="56" width="130" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="279" y="86" text-anchor="middle">Placed</text>
    <rect x="404" y="56" width="130" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="469" y="86" text-anchor="middle">In Transit</text>
    <rect x="594" y="56" width="130" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="659" y="86" text-anchor="middle">Completed</text>

    <rect x="214" y="210" width="130" height="50" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="279" y="240" text-anchor="middle">Cancelled</text>
  </g>

  <!-- legend -->
  <text x="24" y="290" font-size="12" fill="#475569">Cancelling is available before Completed only; nothing has posted yet, so there is nothing to reverse.</text>
</svg>
