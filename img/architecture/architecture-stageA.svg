<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <symbol id="db" viewBox="0 0 56 54" overflow="visible">
      <path d="M 0,6 L 0,42 A 28,6 0 0,0 56,42 L 56,6 Z" fill="currentColor" stroke="#3d7ab8" stroke-width="1.3"/>
      <path d="M 0,20 A 28,6 0 0,0 56,20" fill="none" stroke="#3d7ab8" stroke-width="0.8" opacity="0.45"/>
      <path d="M 0,32 A 28,6 0 0,0 56,32" fill="none" stroke="#3d7ab8" stroke-width="0.8" opacity="0.45"/>
      <ellipse cx="28" cy="6" rx="28" ry="6" fill="currentColor" stroke="#3d7ab8" stroke-width="1.3"/>
    </symbol>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#222">Pharus Architecture — Stage A</text>
  <text x="490" y="52" text-anchor="middle" font-size="12" fill="#666">Modular monolith on the existing shared database · backend owns all business logic · single public API</text>

  <!-- ============ Layer 5 — Clients ============ -->
  <g>
    <rect x="60" y="68" width="860" height="80" rx="10" fill="#e8ffe8" stroke="#4a8a4a" stroke-width="1.8"/>
    <text x="80" y="88" font-size="14" font-weight="700" fill="#1f4d1f">Layer 5 — Clients</text>
    <text x="80" y="106" font-size="12" fill="#2e6b2e">Web app consumes the public API · thin client, no business logic</text>

    <g font-size="12" font-weight="600" fill="#1f4d1f" text-anchor="middle">
      <rect x="430" y="114" width="120" height="26" rx="6" fill="#ffffff" stroke="#4a8a4a" stroke-width="1.3"/>
      <text x="490" y="132">Web app</text>
    </g>
  </g>

  <line x1="490" y1="148" x2="490" y2="161" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ============ Layer 4 — User-facing API ============ -->
  <g>
    <rect x="60" y="163" width="860" height="68" rx="10" fill="#ffe8f0" stroke="#bf5f8a" stroke-width="1.8"/>
    <text x="80" y="183" font-size="14" font-weight="700" fill="#73294a">Layer 4 — User-facing API</text>
    <text x="80" y="200" font-size="12" fill="#943c66">Single service · public, versioned contract · operations · reads · events</text>
    <rect x="370" y="208" width="240" height="20" rx="5" fill="#ffffff" stroke="#bf5f8a" stroke-width="1.3"/>
    <text x="490" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#73294a">Pharus API</text>
  </g>

  <line x1="490" y1="231" x2="490" y2="244" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ============ Layer 3 — Business Logic ============ -->
  <g>
    <rect x="60" y="246" width="860" height="68" rx="10" fill="#f0e8ff" stroke="#7a5fbf" stroke-width="1.8"/>
    <text x="80" y="266" font-size="14" font-weight="700" fill="#3d2a73">Layer 3 — Business Logic</text>
    <text x="80" y="283" font-size="12" fill="#5a4593">First template · workflows · validations · orchestration · J&amp;B follows in a later stage</text>
    <rect x="370" y="291" width="240" height="20" rx="5" fill="#ffffff" stroke="#7a5fbf" stroke-width="1.3"/>
    <text x="490" y="305" text-anchor="middle" font-size="12" font-weight="600" fill="#3d2a73">Anthem template</text>
  </g>

  <line x1="490" y1="314" x2="490" y2="327" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ============ Layer 2 — Domain Components ============ -->
  <g>
    <rect x="60" y="329" width="860" height="100" rx="10" fill="#fff4e0" stroke="#c9892a" stroke-width="1.8"/>
    <text x="80" y="349" font-size="14" font-weight="700" fill="#704c0e">Layer 2 — Domain Components</text>
    <text x="80" y="366" font-size="12" fill="#8a5e16">Stateless modules · one per domain · in-process · operate on the connection handed to them</text>

    <g font-size="11" font-weight="600" fill="#704c0e" text-anchor="middle">
      <rect x="80"  y="378" width="120" height="40" rx="6" fill="#ffffff" stroke="#c9892a" stroke-width="1.3"/>
      <text x="140" y="396">Platform</text>
      <text x="140" y="410" font-size="10" fill="#8a5e16" font-weight="400">module</text>

      <rect x="220" y="378" width="120" height="40" rx="6" fill="#ffffff" stroke="#c9892a" stroke-width="1.3"/>
      <text x="280" y="396">Purchase Order</text>
      <text x="280" y="410" font-size="10" fill="#8a5e16" font-weight="400">module</text>

      <rect x="360" y="378" width="120" height="40" rx="6" fill="#ffffff" stroke="#c9892a" stroke-width="1.3"/>
      <text x="420" y="396">Work Order</text>
      <text x="420" y="410" font-size="10" fill="#8a5e16" font-weight="400">module</text>

      <rect x="500" y="378" width="120" height="40" rx="6" fill="#ffffff" stroke="#c9892a" stroke-width="1.3"/>
      <text x="560" y="396">Sales Order</text>
      <text x="560" y="410" font-size="10" fill="#8a5e16" font-weight="400">module</text>

      <rect x="640" y="378" width="120" height="40" rx="6" fill="#ffffff" stroke="#c9892a" stroke-width="1.3"/>
      <text x="700" y="396">Materials Inv.</text>
      <text x="700" y="410" font-size="10" fill="#8a5e16" font-weight="400">module</text>

      <rect x="780" y="378" width="120" height="40" rx="6" fill="#ffffff" stroke="#c9892a" stroke-width="1.3"/>
      <text x="840" y="396">Finished Goods</text>
      <text x="840" y="410" font-size="10" fill="#8a5e16" font-weight="400">module</text>
    </g>
  </g>

  <!-- "Single backend service" annotation spanning L4+L3+L2 -->
  <g>
    <path d="M 935 165 L 945 165 L 945 427 L 935 427" fill="none" stroke="#888" stroke-width="1.2"/>
    <text x="958" y="296" font-size="11" fill="#555" font-weight="600" text-anchor="middle" transform="rotate(90, 958, 296)">single backend service</text>
  </g>

  <line x1="490" y1="429" x2="490" y2="442" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ============ Layer 1 — Data ============ -->
  <g>
    <rect x="60" y="444" width="860" height="155" rx="10" fill="#e8f4ff" stroke="#3d7ab8" stroke-width="1.8"/>
    <text x="80" y="464" font-size="14" font-weight="700" fill="#1f4870">Layer 1 — Data</text>
    <text x="80" y="481" font-size="12" fill="#2c5d8a">Single Postgres instance · one shared database · tenants isolated by `tenant_id` column · schema unchanged from today</text>

    <g color="#cfe3f5">
      <use href="#db" x="460" y="500" width="60" height="58"/>
    </g>
    <text x="490" y="582" text-anchor="middle" font-size="12" font-weight="700" fill="#1f4870">shared database</text>
    <text x="490" y="595" text-anchor="middle" font-size="10" fill="#2c5d8a" font-style="italic">all tenants</text>
  </g>
</svg>
