<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- ledger labels: only the two statuses that move stock -->
  <text x="279" y="46" text-anchor="middle" font-size="11" fill="#0891b2">writes TRANSFER (source)</text>
  <text x="469" y="46" text-anchor="middle" font-size="11" fill="#0891b2">writes RECEIVE (dest)</text>

  <!-- linear chain, bidirectional (steps are reversible) -->
  <line x1="154" y1="81" x2="214" y2="81" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="344" y1="81" x2="404" y2="81" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- state boxes -->
  <g font-size="14" font-weight="600" fill="#0f172a">
    <rect x="24"  y="56" width="130" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="89"  y="86" text-anchor="middle">Planning</text>
    <rect x="214" y="56" width="130" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="279" y="86" text-anchor="middle">In Transit</text>
    <rect x="404" y="56" width="130" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="469" y="86" text-anchor="middle">Completed</text>
  </g>

  <!-- legend -->
  <text x="24" y="150" font-size="12" fill="#475569">Reaching In Transit writes the outbound TRANSFER; reaching Completed writes the inbound RECEIVE. Planning moves no stock, and every step is reversible.</text>
</svg>
