<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 310" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- books labels: what each status adds to the ledger -->
  <text x="254" y="46" text-anchor="middle" font-size="11" fill="#0891b2">books ORDER + DEMAND</text>
  <text x="424" y="46" text-anchor="middle" font-size="11" fill="#0891b2">books ALLOCATE</text>
  <text x="620" y="46" text-anchor="middle" font-size="11" fill="#0891b2">books PRODUCE + CONSUME</text>

  <!-- cluster transitions (bidirectional) -->
  <line x1="144" y1="81" x2="194" y2="81" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="314" y1="81" x2="364" y2="81" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- receipt transitions -->
  <line x1="484" y1="81" x2="560" y2="81" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
  <text x="522" y="72" text-anchor="middle" font-size="12" fill="#16a34a">post a receipt</text>
  <line x1="680" y1="81" x2="730" y2="81" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahg)"/>

  <!-- Received <-> Completed -->
  <line x1="850" y1="81" x2="900" y2="81" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="875" y="72" text-anchor="middle" font-size="10" fill="#475569">close /</text>
  <text x="875" y="100" text-anchor="middle" font-size="10" fill="#475569">revert</text>

  <!-- Partial -> Completed (close short) -->
  <path d="M620,106 C730,160 850,160 960,106" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
  <text x="790" y="160" text-anchor="middle" font-size="12" fill="#475569">close short</text>

  <!-- cancel / reactivate: from any pre-Partial status -->
  <line x1="84"  y1="106" x2="84"  y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="254" y1="106" x2="254" y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="424" y1="106" x2="424" y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="84"  y1="140" x2="424" y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="254" y1="140" x2="254" y2="210" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="270" y="178" text-anchor="start" font-size="12" fill="#475569">cancel / reactivate</text>
  <text x="270" y="194" text-anchor="start" font-size="11" fill="#94a3b8">(before Partial only)</text>

  <!-- state boxes -->
  <g font-size="14" font-weight="600" fill="#0f172a">
    <rect x="24"  y="56" width="120" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="84"  y="86" text-anchor="middle">Planning</text>
    <rect x="194" y="56" width="120" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="254" y="86" text-anchor="middle">Placed</text>
    <rect x="364" y="56" width="120" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="424" y="86" text-anchor="middle">Production</text>
    <rect x="560" y="56" width="120" height="50" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="620" y="86" text-anchor="middle">Partial</text>
    <rect x="730" y="56" width="120" height="50" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="790" y="86" text-anchor="middle">Received</text>
    <rect x="900" y="56" width="120" height="50" rx="10" fill="#ecfccb" stroke="#bef264" stroke-width="1.5"/>
    <text x="960" y="86" text-anchor="middle">Completed</text>

    <rect x="194" y="210" width="120" height="50" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="254" y="240" text-anchor="middle">Cancelled</text>
  </g>

  <!-- legend -->
  <line x1="560" y1="232" x2="598" y2="232" stroke="#334155" stroke-width="2"/>
  <text x="608" y="236" font-size="12" fill="#475569">set by hand (you)</text>
  <line x1="560" y1="254" x2="598" y2="254" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="608" y="258" font-size="12" fill="#475569">driven by receipts</text>
</svg>
