<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 300" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- zone labels -->
  <text x="396" y="44" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#64748b">SET BY HAND</text>
  <text x="978" y="44" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#64748b">DRIVEN BY RECEIPTS</text>

  <!-- cluster transitions (bidirectional) -->
  <line x1="144" y1="81" x2="180" y2="81" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="300" y1="81" x2="336" y2="81" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="456" y1="81" x2="492" y2="81" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="612" y1="81" x2="648" y2="81" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- receipt transitions -->
  <line x1="768" y1="81" x2="840" y2="81" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
  <text x="804" y="72" text-anchor="middle" font-size="12" fill="#16a34a">post a receipt</text>
  <line x1="960" y1="81" x2="996" y2="81" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
  <text x="978" y="72" text-anchor="middle" font-size="12" fill="#16a34a">receipt</text>

  <!-- Received <-> Completed (close / revert) -->
  <line x1="1116" y1="81" x2="1152" y2="81" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="1134" y="72" text-anchor="middle" font-size="10" fill="#475569">close /</text>
  <text x="1134" y="100" text-anchor="middle" font-size="10" fill="#475569">revert</text>

  <!-- Partial -> Completed (close short) -->
  <path d="M900,56 C1010,14 1110,14 1212,52" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ah)"/>
  <text x="1056" y="14" text-anchor="middle" font-size="12" fill="#475569">close short</text>

  <!-- delete receipts (back) -->
  <path d="M876,106 C840,158 766,158 730,106" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
  <text x="803" y="150" text-anchor="middle" font-size="12" fill="#16a34a">delete receipts</text>

  <!-- cancel / reactivate: from any cluster state -->
  <line x1="84"  y1="106" x2="84"  y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="240" y1="106" x2="240" y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="396" y1="106" x2="396" y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="552" y1="106" x2="552" y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="708" y1="106" x2="708" y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="84"  y1="140" x2="708" y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="396" y1="140" x2="396" y2="210" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="412" y="184" text-anchor="start" font-size="12" fill="#475569">cancel / reactivate</text>

  <!-- state boxes -->
  <g font-size="14" font-weight="600" fill="#0f172a">
    <rect x="24"   y="56" width="120" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="84"   y="86" text-anchor="middle">Draft</text>
    <rect x="180"  y="56" width="120" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="240"  y="86" text-anchor="middle">Entered</text>
    <rect x="336"  y="56" width="120" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="396"  y="86" text-anchor="middle">Placed</text>
    <rect x="492"  y="56" width="120" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="552"  y="86" text-anchor="middle">Production</text>
    <rect x="648"  y="56" width="120" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="708"  y="86" text-anchor="middle">In Transit</text>
    <rect x="840"  y="56" width="120" height="50" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="900"  y="86" text-anchor="middle">Partial</text>
    <rect x="996"  y="56" width="120" height="50" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="1056" y="86" text-anchor="middle">Received</text>
    <rect x="1152" y="56" width="120" height="50" rx="10" fill="#ecfccb" stroke="#bef264" stroke-width="1.5"/>
    <text x="1212" y="86" text-anchor="middle">Completed</text>
    <rect x="336"  y="210" width="120" height="50" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="396"  y="240" text-anchor="middle">Cancelled</text>
  </g>

  <!-- legend -->
  <line x1="840" y1="232" x2="878" y2="232" stroke="#334155" stroke-width="2"/>
  <text x="888" y="236" font-size="12" fill="#475569">set by hand (you)</text>
  <line x1="840" y1="254" x2="878" y2="254" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="888" y="258" font-size="12" fill="#475569">driven by receipts</text>
</svg>
