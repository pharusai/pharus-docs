<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- ledger labels: what each of the first three statuses books -->
  <text x="89"  y="46" text-anchor="middle" font-size="11" fill="#0891b2">books DEMAND</text>
  <text x="279" y="46" text-anchor="middle" font-size="11" fill="#0891b2">books ALLOCATE</text>
  <text x="469" y="46" text-anchor="middle" font-size="11" fill="#0891b2">books CONSUME</text>

  <!-- linear chain, bidirectional -->
  <line x1="154" y1="81" x2="214" y2="81" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="344" y1="81" x2="404" y2="81" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="534" y1="81" x2="594" y2="81" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="724" y1="81" x2="784" y2="81" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- reject / reactivate bus from the chain -->
  <line x1="89"  y1="106" x2="89"  y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="279" y1="106" x2="279" y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="469" y1="106" x2="469" y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="659" y1="106" x2="659" y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="849" y1="106" x2="849" y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="89"  y1="140" x2="849" y2="140" stroke="#334155" stroke-width="2"/>
  <line x1="469" y1="140" x2="469" y2="210" stroke="#334155" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="485" y="184" text-anchor="start" font-size="12" fill="#475569">reject / reactivate</text>

  <!-- state boxes -->
  <g font-size="14" font-weight="600" fill="#0f172a">
    <rect x="24"  y="56" width="130" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="89"  y="86" text-anchor="middle">Received</text>
    <rect x="214" y="56" width="130" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="279" y="86" text-anchor="middle">Entered</text>
    <rect x="404" y="56" width="130" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="469" y="86" text-anchor="middle">Shipped</text>
    <rect x="594" y="56" width="130" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="659" y="86" text-anchor="middle">Invoiced</text>
    <rect x="784" y="56" width="130" height="50" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="849" y="86" text-anchor="middle">Completed</text>

    <rect x="404" y="210" width="130" height="50" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="469" y="240" text-anchor="middle">Rejected</text>

    <rect x="620" y="210" width="120" height="50" rx="10" fill="#ecfccb" stroke="#bef264" stroke-width="1.5"/>
    <text x="680" y="240" text-anchor="middle">Paid</text>
    <rect x="770" y="210" width="130" height="50" rx="10" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
    <text x="835" y="240" text-anchor="middle">In-Dispute</text>
  </g>

  <!-- legend -->
  <text x="620" y="290" font-size="12" fill="#475569">Paid and In-Dispute are flags: set or clear anytime, no inventory effect.</text>
</svg>
